<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Inline Formatting</title>
</head>
<body>
    <p>
        Learning HTML is <strong>fun</strong> and <em>exciting</em>! 
        You should always <mark>practice daily</mark>.<br>
        <small>Updated this week</small>
    </p>
</body>
</html>
